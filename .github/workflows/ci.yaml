name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  baselines:
    name: Page baselines
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Page baselines
        run: sh scripts/check-baselines.sh
